[project]
name = "xweb"
version = "0.1.0"
description = "Moteur de rendu QWeb et SDK de plugin pour xcore — voir docs/spec-v1.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.0",
    "markupsafe>=3.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # xweb.csrf reads request.form() — starlette needs this to parse it
    "xcoreruntime[cli,sdk,xcli]>=2.5.2",
    "cryptography>=50.0.1",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "weasyprint>=69.0",
    "aiomqtt>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
